name: 🐞 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report! Please search
        [existing issues](../issues?q=is%3Aissue) first — yours may already be known.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Configure …
        3. See error

  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Shown in HACS, or the `version` in the integration's manifest.
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: e.g. 2026.9.0
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How is it installed?
      options:
        - HACS
        - Manual (copied to custom_components)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        Settings → System → Logs (enable debug logging if you can). Please
        redact any tokens, keys, or coordinates you'd rather not share.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I'm on the latest version of the integration.
          required: true
        - label: I searched existing issues and didn't find a duplicate.
          required: true
