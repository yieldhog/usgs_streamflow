name: Tests
on: [push, pull_request]
jobs:
  unittest:
    name: Logic tests (dependency-free)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  harness:
    name: HA harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component pins a recent Home Assistant,
          # which requires Python 3.13.
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run HA harness suite with coverage
        run: |
          pytest tests_ha/ \
            --cov=custom_components.usgs_streamflow \
            --cov-report=term-missing
