name: Tests
on: [push, pull_request]
jobs:
  unittest:
    name: Logic tests (dependency-free)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  harness:
    name: HA harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component pins a recent Home Assistant,
          # which requires Python 3.13.
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run both suites with combined coverage
        run: |
          # The dependency-free logic suite (stubs HA) and the HA harness suite
          # run in separate processes; append both into one coverage data file
          # so the total reflects real end-to-end coverage.
          coverage run -m unittest discover -s tests -t .
          coverage run -a -m pytest tests_ha/
          coverage report --show-missing \
            --include='custom_components/usgs_streamflow/*'
