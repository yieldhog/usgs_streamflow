; Strict typing for the usgs_streamflow integration.
;
; This mirrors the mypy configuration Home Assistant Core generates for
; integrations listed in its `.strict-typing` file (see
; `script/hassfest/mypy_config.py`): the general settings plus the per-module
; "strict" block. Passing here is therefore a faithful proxy for the Platinum
; `strict-typing` quality-scale rule. Run against a checkout that has
; `homeassistant` installed (CI does this on Python 3.13) so the HA base classes
; resolve to their real types rather than `Any`.
;
; The settings live in the global section because this repository only type-checks
; the single integration package; in core the strict half is a per-module block.
[mypy]
python_version = 3.13
platform = linux
follow_imports = normal
local_partial_types = true
strict_equality = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = ignore-without-code, redundant-self, truthy-iterable
disable_error_code = annotation-unchecked, import-not-found, import-untyped
extra_checks = false
; HA keeps warn_unreachable off — defensive guards against states the type system
; deems unreachable (e.g. a coordinator's data before first refresh) are idiomatic
; in core integrations.
warn_unreachable = false

; --- strict block (applied to strict-typed integrations in core) ---
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
