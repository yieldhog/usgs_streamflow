; Strict typing for the usgs_streamflow integration.
;
; Mirrors the settings Home Assistant Core applies to integrations listed in
; its `.strict-typing` file, so passing here is a faithful proxy for the
; Platinum `strict-typing` quality-scale rule. Run against a checkout that has
; `homeassistant` installed (CI does this on Python 3.13) so the HA base classes
; resolve to their real types rather than `Any`.
[mypy]
python_version = 3.13
plugins =
follow_imports = normal
local_partial_types = true
strict_equality = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

; --- strict mode (matches HA's per-integration strict block) ---
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true

; Only the integration package is type-checked strictly.
[mypy-tests.*]
ignore_errors = true

[mypy-tests_ha.*]
ignore_errors = true
